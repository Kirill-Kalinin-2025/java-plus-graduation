server:
  port: 8080

spring:
  application:
    name: gateway-server
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/events/**, /admin/events/**, /users/*/events/**
        - id: category-service
          uri: lb://category-service
          predicates:
            - Path=/categories/**, /admin/categories/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**
        - id: compilation-service
          uri: lb://compilation-service
          predicates:
            - Path=/compilations/**, /admin/compilations/**
        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/comments/**, /admin/comments/**, /users/*/comments/**
        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/users/*/requests, /users/*/requests/**, /users/*/events/*/requests, /users/*/events/*/requests/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/