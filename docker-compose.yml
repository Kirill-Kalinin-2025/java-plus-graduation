services:
  stats-server:
    ports:
      - "9090:9090"

  stats-db:
    image: postgres:16.1

  main-service:
    image: main-service

  main-db:
    image: postgres:16.1

  gateway-server:
    ports:
      - "8080:8080"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # Добавляем сервис для создания топиков при старте
  kafka-init:
    image: confluentinc/cp-kafka:7.4.4
    depends_on:
      - kafka
    entrypoint: /bin/sh -c "
      echo 'Waiting for Kafka to be ready...';
      sleep 10;
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stats.user-actions.v1 --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stats.events-similarity.v1 --partitions 3 --replication-factor 1;
      echo 'Topics created successfully';
      exit 0;
      "

  collector:
    build:
      context: .
      dockerfile: stats-service/collector/Dockerfile
    depends_on:
      - kafka
      - discovery-server
      - kafka-init

  aggregator:
    build:
      context: .
      dockerfile: stats-service/aggregator/Dockerfile
    depends_on:
      - kafka
      - discovery-server
      - kafka-init

  analyzer:
    build:
      context: .
      dockerfile: stats-service/analyzer/Dockerfile
    depends_on:
      - kafka
      - discovery-server
      - kafka-init